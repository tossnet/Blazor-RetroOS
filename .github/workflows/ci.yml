name: 'Publish application'
on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest

    env:
      PUBLISH_FOLDER: publish/wwwroot

    steps:
      - name: Set the name of the repo in env variable
        run: echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            10.x

      # Tests target net9.0 (runtime 9.x above). A failing test stops the deployment.
      - name: Dotnet Test
        run: dotnet test Blazor.RetroOS.Tests -c Release

      - name: Dotnet Publish
        run: dotnet publish Blazor.RetroOS -c Release -o publish

      # retroos.css (Blazor bundle) and static/dist (CSS for non-Blazor sites) are regenerated by the build:
      # they must be committed in sync with the retroos-<os>.css sources.
      - name: Check retroos.css and static/dist are up to date
        run: |
          if [ -n "$(git status --porcelain -- static/dist Blazor.RetroOS.Components/wwwroot/css/retroos.css)" ]; then
            git status --short -- static/dist Blazor.RetroOS.Components/wwwroot/css/retroos.css
            echo "::error::retroos.css or static/dist is out of date. Build the solution locally and commit them."
            exit 1
          fi

      - name: Change base-tag in index.html to repo name
        run: sed -i 's/<base href="\/" \/>/<base href="\/${{ env.REPO_NAME }}\/" \/>/g' $PUBLISH_FOLDER/index.html

      - name: copy index.html to 404.html
        run: cp $PUBLISH_FOLDER/index.html $PUBLISH_FOLDER/404.html

      - name: Add .nojekyll file
        run: touch $PUBLISH_FOLDER/.nojekyll

      - name: Deploy GitHub Pages action
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3.6.1
        with:
            github_token: ${{ secrets.PUBLISH_TOKEN }}
            publish_branch: gh-pages
            publish_dir: ${{ env.PUBLISH_FOLDER }}
            allow_empty_commit: false
            keep_files: false
            force_orphan: true
